<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07130f" />
    <title>FurryAR SE</title>
  </head>
  <body>
    <canvas id="stage" aria-label="WebXR Scene Session"></canvas>

    <main id="overlay">
      <header class="topbar glass">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>CyberFurry WebAR Demo</strong>
            <small id="runtime-label">Default Scene</small>
          </div>
        </div>
        <div class="badges" aria-live="polite">
          <span id="ar-badge" class="badge muted">AR 检测中</span>
          <span id="depth-badge" class="badge muted">深度未知</span>
        </div>
        <div class="top-actions">
          <button id="debug-toggle" class="icon-button" type="button" aria-expanded="false" aria-controls="debug-panel">调试</button>
          <button id="start-ar" class="primary" type="button">启动 AR</button>
        </div>
      </header>

      <section class="left-panel glass" aria-label="角色与行为">
        <input id="vrm-input" type="file" accept=".vrm,.glb,model/gltf-binary" hidden />
        <button id="load-vrm" class="wide" type="button">选择本地 VRM</button>
        <button id="place-character" class="wide accent" type="button" disabled>放置角色 / 锁定锚点</button>

        <div class="section-label">本地动画预览</div>
        <input id="vrma-input" type="file" accept=".vrma" hidden />
        <button id="load-vrma" class="wide" type="button" disabled>打开 VRMA 动画</button>
        <div class="preview-controls" role="group" aria-label="动画预览控制">
          <button id="pause-vrma" type="button" disabled>暂停</button>
          <button id="stop-vrma" type="button" disabled>停止预览</button>
        </div>
        <div id="vrma-status" class="preview-status" role="status" aria-live="polite">请先载入 VRM 角色</div>

        <div class="section-label">运动控制</div>
        <label class="control-label" for="navigation-mode">抵达目标的方法</label>
        <select id="navigation-mode"><option value="pathfinding">寻路模式 · 自动绕障</option><option value="direct">移动模式 · 沿直线</option></select>
        <label class="control-label" for="locomotion-style">Locomotion 动作</label>
        <select id="locomotion-style"></select>
        <div id="locomotion-description" class="preview-status"></div>
        <label class="check-row"><input id="procedural-bounce" type="checkbox" /> 程序动作上下起伏</label>
        <div class="section-label">角色行为</div>
        <select id="behavior-mode" aria-label="角色行为"></select>
        <div id="behavior-description" class="preview-status"></div>
        <div class="preview-controls"><button id="target-cursor" type="button">走到光标点</button><button id="stop-behavior" type="button">停止任务</button></div>
        <div class="section-label">同地图特色场景</div>
        <select id="demo-station" aria-label="演示场景"></select>
        <div id="station-description" class="preview-status"></div>
        <div class="preview-controls"><button id="start-station" type="button">演示此场景</button><button id="tour-stations" type="button">全部巡展</button></div>
        <div id="preview-tools">
        <div class="preview-controls"><button id="focus-character" type="button">聚焦角色</button><button id="pause-simulation" type="button">暂停演示</button></div>
        <label class="check-row"><input id="follow-camera" type="checkbox" /> 环绕跟拍</label>
        <label class="check-row"><input id="first-person" type="checkbox" /> 第一人称</label>
        <div id="first-person-settings" hidden>
          <label class="control-label" for="first-person-forward">前移 <output id="first-person-forward-value">0.12 m</output></label>
          <input class="preview-range" id="first-person-forward" type="range" min="0.02" max="0.45" step="0.01" value="0.12" />
          <label class="control-label" for="first-person-height">抬高 <output id="first-person-height-value">0.04 m</output></label>
          <input class="preview-range" id="first-person-height" type="range" min="-0.10" max="0.20" step="0.01" value="0.04" />
        </div>
        <label class="control-label" for="arm-spread">双臂外展偏移 <output id="arm-spread-value">0°</output></label>
        <input class="preview-range" id="arm-spread" type="range" min="0" max="40" step="1" value="0" />
        <label class="control-label" for="simulation-speed">演示播放速度</label>
        <select id="simulation-speed"><option value="1">正常速度</option><option value="0.5">半速 · 0.5×</option><option value="0.25">慢放 · 0.25×</option></select>
        <label class="check-row"><input id="gizmo-enabled" type="checkbox" /> Gizmo 移动角色</label>
        <label class="check-row"><input id="gizmo-snap" type="checkbox" /> 吸附到 0.25 m 网格</label>
        <div id="character-position" class="preview-status">尚未载入角色</div>
        <button id="undo-transform" class="wide" type="button" disabled>撤销上次拖动</button>
        <div class="preview-status">拖动三轴或平面手柄；Esc 取消当前拖动。</div>
        </div>
        <div id="task-status" class="preview-status" role="status"></div>
        <p id="status-copy">请先选择本地 VRM。双击地面设置目标，或使用 Gizmo 移动角色。</p>
      </section>

      <section id="debug-panel" class="debug-panel glass" hidden>
        <div class="debug-heading">
          <strong>碰撞胶囊</strong>
          <span id="fps">-- FPS</span>
        </div>
        <label>
          <span>半径 <output id="radius-value">0.22 m</output></span>
          <input id="capsule-radius" type="range" min="0.10" max="0.60" step="0.01" value="0.22" />
        </label>
        <label>
          <span>高度 <output id="height-value">1.55 m</output></span>
          <input id="capsule-height" type="range" min="0.50" max="2.50" step="0.05" value="1.55" />
        </label>
        <label>
          <span>移动速度 <output id="speed-value">1.10 m/s</output></span>
          <input id="move-speed" type="range" min="0" max="3.00" step="0.05" value="1.10" />
        </label>
        <label class="check-row"><input id="shade-compatibility" type="checkbox" checked /> 修复旧版 VRM 缺失阴影贴图</label>
        <div id="material-status" class="preview-status">尚未载入角色</div>
        <label><span>曝光 <output id="exposure-value">1.00</output></span><input id="exposure" type="range" min="0.5" max="1.5" step="0.05" value="1" /></label>
        <label class="check-row">
          <input id="show-geometry" type="checkbox" />
          <span>显示环境碰撞网格</span>
        </label>
        <div class="debug-stats">
          <span>平面 <b id="plane-count">0</b></span>
          <span>深度三角形 <b id="depth-count">0</b></span>
          <span>状态 <b id="motion-state">idle</b></span>
        </div>
      </section>

      <div id="reticle" aria-hidden="true"><i></i></div>

      <div id="joystick" class="joystick" aria-label="角色移动摇杆">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>

      <button id="jump" class="jump-button" type="button" disabled>跳跃</button>

      <div class="desktop-help glass">
        <b>调试操作</b>
        <span>WASD / QE 相机 · 拖动转向 · 双击地面设目标 · Gizmo 三轴拖动</span>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="loading" class="loading" hidden><span></span><b>正在载入模型…</b></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
